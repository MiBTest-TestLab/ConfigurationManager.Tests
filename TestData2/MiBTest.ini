; STICLI SECSGEM settings section
; To use this settings, please make sure the CommType setting in
; the [DLL] section is set to 1.
; Settings relating to the use of STI CLI communications with the 
; Handler Software. STI CLI consists of Containers. Each Container
; consists of Sections and each Section contains variables. For the
; purpose of SECSGEM there is only one container with multiple 
; Sections, each containing multiple variables.
; Settings Format:
; CLIPath - The full path to STI CLI cache folder that stores the 
;	the variables data.
; Container - The name of the container that stores SECS/GEM related
;	Sections and Variables
; Variable settings format as below:
; InternalVariableName=<Section Name>,<Variable Name>,<Variable Value Data Type>,<Property Change Handling Function Name> 
; 	where:
;		InternalVariableName - is the internal name used by MiBTest to refer to
;								CLI variable
;		Section Name - The name of the Section where the variable is stored
;		Variable Name - The name used by the CLI to refer to the Variable
;		Variable Value Data Type - The data type of the value stored in the Variable
;		Property Changed Handling Function Name - The internal of the function that
;				will be called when the CLI detects a change in the variable value
[STICLI SECSGEM]
CLIPath=D:\STICLITester\Cache
EventConfig=D:\tScanSecsGem\MiBTest\MiBTest.ini,CLIGemEvents
VariableConfig=D:\tScanSecsGem\MiBTest\MiBTest.ini,CLIGemVariables
RemoteCommandConfig=D:\tScanSecsGem\MiBTest\MiBTest.ini,CLIGemRemoteCommand
TerminalRequestConfig=D:\tScanSecsGem\MiBTest\MiBTest.ini,CLITerminalRequest
RecipeConfig=D:\tScanSecsGem\MiBTest\MiBTest.ini,CLIRecipe
AttributeRequestConfig=D:\tScanSecsGem\MiBTest\MiBTest.ini,CLIAttributeRequest
; CLI Handler MMI Window Handle CLI location setting
; Format:
; CLIMmiWinHandle=<CLI Container>/<CLI Section>/<CLI Variable>
CLIMmiWinHandle=master/window handles/MMI
Container=HostComm
; MiBStart value: 1 - started ok, -1 - failed to start, 2 - Shutdown MiBTest
