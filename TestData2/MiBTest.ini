; DLL Section - Specifies main settings for MiBTest application
; CommType=0 or 1
;	Where 0 - Socket communications
;	      1 - CLI Communications
; SocketCommHandlerDLLFilePath - Full path to the
;	DLL file that implements the socket communication protocol
;	between MiBTest and the handler software
; SocketCommHandlerClassName - The full class name in the above
;	DLL file that implements the socket communication protocol
;	between MiBTest and the handler software.
; MiBDllFilePath - The full path to the MiB DLL that is used to
;	implement SECS/GEM communications between the host and equipment
; MiBClassName - The name of the class in the above DLL that implements
;	SECS/GEM communications between the host and Equipment.
; PPDirPath - The full path to the folder used to store recipe files for
;	upload and download to/from the SECS/GEM host.
; DSDirPath - The full path to the folder used to store Data Set files for
;	upload and download to/from the SECS/GEM host.
; BinaryRecipeFormat - To specify the format of the recipe file to use when
;	uploading or downloading to/from SECS/GEM Host. Possible values are:
;	0 - ASCII format
;	1 - Binary format.
; StiGemConfigFilePath - The full path to the configuration file used by
;	MiB DLL
[DLL]
CommType=1
STICLICommHandlerDLLFilePath=D:\tScanSecsGem\MiBTest\MiBTestCLICommHandlerLib.dll
STICLICommHandlerClassName=MiBTestCLICommHandlerLib.STICLICommHandler
MiBDllFilePath=D:\tScanSecsGem\MiBTest\MiB.dll
MiBClassName=MiB.MachineInfoBridge
PPDirPath=D:/PPDir
DSDirPath=D:/PPDir/dataset_transfer
; Recipe file format flag
; 0 - ASCII format, 1 - Binary format
BinaryRecipeFormat=1
StiGemConfigFilePath=D:\tScanSecsGem\StiGem\StiGemMsg.cfg

