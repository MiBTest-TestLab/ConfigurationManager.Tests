; Each section defines a message that is received, sent or replied. The section name
; is the function name of message handling function found in the Socket Comm Handler 
; class defined in the [DLL] section above. Please note that all section names representing
; the message handling function names MUST end with "Cmd"
; CommType=1 or 2 or 3 or 4. Where 1 - Receive, 2 - Send, 3 - Reply, 4 - Reply using event 
; FrameDelimiter - Character used to delimit each frame in the received or sent message
; MinFrameCount - The minimum number of frames in the message. If there are variable number of frames
; VariableFrames - Set to 1 if there are more frames following the minimum number of expected frames, else
;                  set to 0 if there only the expected number of frames specified in MinFrameCount setting.
; FrameData1...N - The allowed contents of the frame. If Frame key data is 'Any', no
;              checking will be done on the frame data received.
; Reply={Reply Message Section Name} - Where {Reply Message Section Name} is the
;                                      section name where the message definition
;                                      of the reply is found.
[HandleMiBStartupCmd]
CommType=1
FrameDelimiter=;
MinFrameCount=2
VariableFrames=0
FrameData1=StartupMiB
FrameData2=MiBConfigFilePath=
Reply=StartupMiBReplyCmd

[HandleMiBShutdownCmd]
CommType=1
FrameDelimiter=;
MinFrameCount=1
VariableFrames=0
